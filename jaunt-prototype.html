<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaunt — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A3D;
    --ink-2:#131E2B;
    --parchment:#F1E9D8;
    --parchment-2:#E7DBBE;
    --brass:#B4894F;
    --brass-dark:#8C6A3B;
    --trail:#4B6455;      /* Exploration */
    --signal:#A8402F;     /* Adrenaline */
    --leisure:#3E6B8A;    /* Leisure */
    --culture:#6B4E71;    /* Culture */
    --nature:#7C8B4A;     /* Nature */
    --slate:#5C6670;
    --cream:#F1E9D8;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(180,137,79,0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(75,100,85,0.12), transparent 45%),
      var(--ink-2);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 12px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 38px, rgba(241,233,216,0.025) 39px, transparent 40px);
    pointer-events:none;
  }
  .phone{
    width:390px;
    max-width:100%;
    background:var(--parchment);
    border-radius:34px;
    border:8px solid var(--ink);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(180,137,79,0.15);
    overflow:hidden;
    position:relative;
  }
  .notch{
    height:22px; background:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .notch::after{
    content:'';
    width:70px; height:6px; background:var(--ink-2); border-radius:4px;
  }
  .app{
    height:730px;
    display:flex;
    flex-direction:column;
    background:var(--parchment);
    position:relative;
  }
  .topbar{
    padding:18px 20px 14px;
    background:var(--ink);
    color:var(--cream);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  .topbar::before{
    content:'';
    position:absolute; inset:0;
    background-image: linear-gradient(rgba(241,233,216,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(241,233,216,0.04) 1px, transparent 1px);
    background-size:14px 14px;
    opacity:0.5;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    position:relative;
  }
  .brand span{color:var(--brass);}
  .tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.3px;
    color:var(--brass);
    margin-top:3px;
    line-height:1.4;
    max-width:240px;
    position:relative;
  }
  .profile-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:2px solid var(--brass);
    background:rgba(180,137,79,0.12);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    position:relative;
  }
  .profile-btn svg{width:17px; height:17px; color:var(--brass);}

  /* ---- Profile / standing panel ---- */
  .tier-stamp{
    width:104px; height:104px;
    border-radius:50%;
    border:3px solid var(--brass);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin:6px auto 14px;
    background:radial-gradient(circle, rgba(180,137,79,0.08), transparent 70%);
    position:relative;
    transform:rotate(-4deg);
  }
  .tier-stamp::before{
    content:'';
    position:absolute; inset:6px;
    border:1px dashed var(--brass);
    border-radius:50%;
    opacity:0.6;
  }
  .tier-stamp .tier-name{
    font-family:'Fraunces', serif; font-weight:700; font-size:14px; color:var(--ink);
    text-align:center; line-height:1.15; padding:0 8px;
  }
  .tier-stamp .tier-sub{
    font-family:'IBM Plex Mono', monospace; font-size:8px; letter-spacing:1px;
    text-transform:uppercase; color:var(--brass-dark); margin-top:3px;
  }
  .stat-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid rgba(27,42,61,0.08);
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-label{font-size:12.5px; color:var(--slate);}
  .stat-value{font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600; color:var(--ink);}
  .bar-track{
    width:100%; height:7px; border-radius:20px;
    background:rgba(27,42,61,0.1); overflow:hidden; margin-top:6px;
  }
  .bar-fill{height:100%; border-radius:20px; background:var(--trail); transition:width .3s ease;}
  .perk-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid rgba(27,42,61,0.08);
  }
  .perk-row:last-child{border-bottom:none;}
  .perk-icon{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .perk-icon svg{width:14px; height:14px;}
  .perk-icon.unlocked{background:var(--trail); color:#fff;}
  .perk-icon.locked{background:rgba(27,42,61,0.08); color:var(--slate);}
  .perk-text{flex:1;}
  .perk-name{font-size:12.5px; font-weight:600; color:var(--ink);}
  .perk-desc{font-size:10.5px; color:var(--slate); margin-top:1px;}
  .perk-status{
    font-family:'IBM Plex Mono', monospace; font-size:8.5px; letter-spacing:0.5px; text-transform:uppercase;
  }
  .perk-status.unlocked{color:var(--trail);}
  .perk-status.locked{color:var(--slate);}
  .upcoming-card{
    background:var(--parchment-2); border-radius:10px; padding:12px; margin-top:8px;
    border:1px solid rgba(27,42,61,0.1);
  }
  .upcoming-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .upcoming-name{font-family:'Fraunces', serif; font-weight:600; font-size:13.5px; color:var(--ink);}
  .upcoming-date{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--brass-dark);}
  .upcoming-loc{font-size:11px; color:var(--slate); margin-top:1px;}

  /* ---- Profile tab: header, map, pills ---- */
  .profile-head{
    display:flex; align-items:center; gap:12px;
    padding:4px 0 6px;
  }
  .avatar{
    width:54px; height:54px; border-radius:50%;
    background:var(--ink); color:var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:700; font-size:20px;
    border:2px solid var(--brass);
    flex-shrink:0; cursor:pointer; position:relative;
  }
  .profile-name{font-family:'Fraunces', serif; font-weight:600; font-size:16px; color:var(--ink);}
  .profile-rank{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--brass-dark);
    margin-top:3px;
  }
  .profile-tier-chip{
    display:inline-block; margin-top:5px;
    font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:0.5px; text-transform:uppercase;
    color:var(--ink); background:var(--parchment-2); border:1px solid var(--brass);
    padding:2px 8px; border-radius:20px;
  }
  .map-card{
    background:#fff; border-radius:var(--radius); padding:10px;
    box-shadow:0 4px 14px -6px rgba(27,42,61,0.2); border:1px solid rgba(27,42,61,0.06);
  }
  .map-card svg{width:100%; height:auto; display:block;}
  .map-caption{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; color:var(--slate); margin-top:8px; padding:0 2px;
  }
  .map-legend{display:flex; gap:8px; flex-wrap:wrap;}
  .legend-dot{display:inline-flex; align-items:center; gap:3px; font-size:9.5px; color:var(--slate);}
  .legend-dot::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--c); display:inline-block;}
  .pill-nav{
    display:flex; gap:6px; margin:16px 0 4px; overflow-x:auto; padding-bottom:2px;
  }
  .pill-nav::-webkit-scrollbar{display:none;}
  .pill{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.5px; text-transform:uppercase;
    padding:7px 13px; border-radius:20px; white-space:nowrap; cursor:pointer;
    border:1.5px solid var(--slate); color:var(--slate); background:transparent; flex-shrink:0;
  }
  .pill.active{background:var(--ink); color:var(--cream); border-color:var(--ink);}
  .rec-why{
    font-size:11px; color:var(--brass-dark); margin-top:6px; font-style:italic;
  }
  .want-flag{
    position:absolute; top:0; right:12px;
    width:16px; height:22px; background:var(--brass);
    clip-path:polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
  }

  /* ---- Friend tagging ---- */
  .friend-grid{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 6px;}
  .friend-chip{
    display:flex; align-items:center; gap:6px;
    padding:6px 11px 6px 6px; border-radius:20px;
    border:1.5px solid var(--slate); background:#fff;
    cursor:pointer; font-size:12px; color:var(--slate);
    font-family:'Inter', sans-serif;
  }
  .friend-chip .mini-avatar{
    width:20px; height:20px; border-radius:50%;
    background:var(--parchment-2); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:9px; font-weight:600;
    flex-shrink:0;
  }
  .friend-chip.selected{border-color:var(--brass); background:var(--brass); color:#fff;}
  .friend-chip.selected .mini-avatar{background:rgba(255,255,255,0.3); color:#fff;}

  /* ---- Photo upload ---- */
  .photo-box{
    border:1.5px dashed var(--slate); border-radius:10px; padding:20px 12px;
    text-align:center; cursor:pointer; color:var(--slate); font-size:12px;
    background:rgba(255,255,255,0.4);
  }
  .photo-box svg{width:22px; height:22px; margin-bottom:6px; display:block; margin-left:auto; margin-right:auto;}
  .photo-preview-wrap{position:relative;}
  .photo-preview{width:100%; height:150px; border-radius:10px; object-fit:cover; display:block;}
  .photo-remove{
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:rgba(19,30,43,0.75); color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }

  /* ---- Avatar stacks & row thumbnails ---- */
  .mini-avatar{
    width:20px; height:20px; border-radius:50%;
    background:var(--ink); color:var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:8px; font-weight:600;
    flex-shrink:0;
  }
  .avatar-stack{display:flex; margin-top:6px;}
  .avatar-stack .mini-avatar{
    border:1.5px solid var(--parchment); margin-left:-6px;
  }
  .avatar-stack .mini-avatar:first-child{margin-left:0;}
  .row-thumb{width:36px; height:36px; border-radius:8px; object-fit:cover; flex-shrink:0;}

  /* ---- Feed ---- */
  .feed-post{
    background:#fff; border-radius:var(--radius); padding:14px;
    margin-bottom:12px; box-shadow:0 4px 14px -6px rgba(27,42,61,0.2);
    border:1px solid rgba(27,42,61,0.06); cursor:pointer;
  }
  .feed-top{display:flex; gap:10px; align-items:flex-start;}
  .feed-avatar{width:36px; height:36px; font-size:12px;}
  .feed-body{flex:1; min-width:0;}
  .feed-text{font-size:13px; color:var(--ink); line-height:1.4;}
  .feed-meta{font-size:11px; color:var(--slate); margin-top:3px;}
  .feed-note{font-size:12.5px; color:var(--slate); margin-top:8px; font-style:italic; line-height:1.4;}
  .feed-time{font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--slate); flex-shrink:0; margin-left:6px;}
  .feed-photo{width:100%; height:130px; object-fit:cover; border-radius:8px; margin-top:10px;}

  /* ---- Friend notes (what your friends think) ---- */
  .friend-note-row{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid rgba(27,42,61,0.08);}
  .friend-note-row:last-child{border-bottom:none;}
  .friend-note-top{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink); font-weight:600;}
  .friend-note-text{font-size:12px; color:var(--slate); margin-top:3px; font-style:italic; line-height:1.4;}

  /* ---- Search ---- */
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1.5px solid rgba(27,42,61,0.15); border-radius:24px;
    padding:10px 14px; margin-bottom:4px; color:var(--slate);
  }
  .search-box svg{width:17px; height:17px; flex-shrink:0;}
  .search-box input{
    border:none; outline:none; background:transparent; flex:1;
    font-family:'Inter', sans-serif; font-size:13.5px; color:var(--ink);
  }
  .search-result-row{
    display:flex; align-items:center; gap:10px; padding:10px 4px; cursor:pointer;
    border-bottom:1px solid rgba(27,42,61,0.06);
  }
  .search-result-name{font-family:'Fraunces', serif; font-weight:600; font-size:13.5px; color:var(--ink);}
  .search-result-loc{font-size:11px; color:var(--slate);}
  .search-badge{
    font-family:'IBM Plex Mono', monospace; font-size:8px; text-transform:uppercase;
    color:var(--slate); background:var(--parchment-2); border-radius:10px; padding:2px 7px; flex-shrink:0;
  }
  .request-add-row{
    display:flex; align-items:center; gap:10px;
    border:1.5px dashed var(--brass); border-radius:10px;
    padding:14px; margin-top:8px; cursor:pointer;
    color:var(--slate); font-size:12.5px; line-height:1.4;
  }
  .request-add-row svg{width:20px; height:20px; color:var(--brass); flex-shrink:0;}
  .request-add-link{color:var(--brass-dark); font-weight:600; text-decoration:underline;}

  /* ---- Notifications ---- */
  .notif-row{display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-bottom:1px solid rgba(27,42,61,0.08);}
  .notif-row:last-child{border-bottom:none;}
  .notif-row.unread{background:rgba(180,137,79,0.06); margin:0 -8px; padding:11px 8px; border-radius:8px;}
  .notif-icon{width:30px; height:30px; border-radius:50%; background:var(--parchment-2); color:var(--brass-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .notif-icon svg{width:15px; height:15px;}
  .notif-text{font-size:12.5px; color:var(--ink); line-height:1.4;}
  .notif-time{font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--slate); margin-top:2px;}

  /* ---- Messages ---- */
  .convo-row{display:flex; gap:10px; align-items:center; padding:12px 0; border-bottom:1px solid rgba(27,42,61,0.08); cursor:pointer;}
  .convo-row:last-child{border-bottom:none;}
  .convo-name{font-family:'Fraunces', serif; font-weight:600; font-size:13.5px; color:var(--ink);}
  .convo-preview{font-size:11.5px; color:var(--slate); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;}
  .convo-unread-dot{width:8px; height:8px; border-radius:50%; background:var(--signal); flex-shrink:0;}
  .msg-bubble{max-width:78%; padding:9px 13px; border-radius:14px; font-size:12.5px; line-height:1.4; margin-bottom:8px;}
  .msg-bubble.them{background:var(--parchment-2); color:var(--ink); border-bottom-left-radius:4px; align-self:flex-start;}
  .msg-bubble.you{background:var(--ink); color:var(--cream); border-bottom-right-radius:4px; align-self:flex-end; margin-left:auto;}
  .msg-thread{display:flex; flex-direction:column; max-height:340px; overflow-y:auto; padding:4px 2px;}
  .msg-input-row{display:flex; gap:8px; margin-top:12px;}
  .msg-input-row input{flex:1; border:1.5px solid rgba(27,42,61,0.2); border-radius:20px; padding:9px 14px; font-family:'Inter', sans-serif; font-size:13px;}

  /* ---- Badges ---- */
  .badge-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:6px;}
  .badge-card{text-align:center; padding:12px 6px; border-radius:12px; background:#fff; border:1px solid rgba(27,42,61,0.08);}
  .badge-card.locked{opacity:0.4;}
  .badge-circle{width:44px; height:44px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; background:var(--brass); color:#fff;}
  .badge-circle svg{width:20px; height:20px;}
  .badge-card.locked .badge-circle{background:var(--slate);}
  .badge-name{font-family:'Fraunces', serif; font-weight:600; font-size:11px; color:var(--ink); line-height:1.25;}
  .badge-desc{font-size:9.5px; color:var(--slate); margin-top:3px; line-height:1.3;}

  /* ---- Year in travel recap ---- */
  .recap-card{background:linear-gradient(160deg, var(--ink), var(--ink-2)); color:var(--cream); border-radius:16px; padding:24px 20px; text-align:center;}
  .recap-title{font-family:'Fraunces', serif; font-weight:700; font-size:20px; color:var(--brass);}
  .recap-sub{font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; opacity:0.7; margin-top:4px;}
  .recap-stats{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:22px 0;}
  .recap-stat-num{font-family:'Fraunces', serif; font-weight:700; font-size:28px; color:#fff;}
  .recap-stat-label{font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; opacity:0.65; margin-top:2px;}
  .recap-highlight{border-top:1px dashed rgba(241,233,216,0.3); padding-top:16px; margin-top:6px; font-size:12px; opacity:0.85;}

  /* ---- Photo gallery ---- */
  .gallery-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .gallery-row::-webkit-scrollbar{display:none;}
  .gallery-thumb{position:relative; flex-shrink:0; width:84px; height:84px; border-radius:10px; overflow:hidden;}
  .gallery-thumb img{width:100%; height:100%; object-fit:cover;}
  .gallery-thumb .photo-remove{width:20px; height:20px; top:4px; right:4px;}
  .gallery-add{
    flex-shrink:0; width:84px; height:84px; border-radius:10px;
    border:1.5px dashed var(--slate); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--slate);
  }
  .photo-note-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .photo-note-row .field-select{padding:8px 10px; font-size:12px;}

  /* ---- List creation ---- */
  .checkbox-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(27,42,61,0.06); cursor:pointer;}
  .checkbox-row:last-child{border-bottom:none;}
  .checkbox-box{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--slate); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .checkbox-box.checked{background:var(--brass); border-color:var(--brass); color:#fff;}
  .checkbox-box svg{width:12px; height:12px;}

  /* ---- Curated lists ---- */
  .list-scroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px;}
  .list-scroll::-webkit-scrollbar{display:none;}
  .list-card{
    flex-shrink:0; width:150px; height:110px; border-radius:12px;
    background:var(--c); position:relative; overflow:hidden; cursor:pointer;
    display:flex; align-items:flex-end; padding:10px;
    box-shadow:0 4px 14px -6px rgba(27,42,61,0.3);
  }
  .list-card::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 30%, rgba(19,30,43,0.75) 100%);
  }
  .list-card-text{position:relative; color:#fff;}
  .list-card-title{font-family:'Fraunces', serif; font-weight:700; font-size:13px; line-height:1.2;}
  .list-card-sub{font-family:'IBM Plex Mono', monospace; font-size:9px; margin-top:3px; opacity:0.9;}

  /* ---- Near you ---- */
  .field-select{
    width:100%; border:1.5px solid rgba(27,42,61,0.2); background:#fff; border-radius:8px;
    padding:9px 11px; font-family:'Inter', sans-serif; font-size:13px; color:var(--ink);
  }
  .nearby-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(27,42,61,0.08); cursor:pointer;}
  .nearby-row:last-child{border-bottom:none;}
  .nearby-dist{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--brass-dark); flex-shrink:0;}

  /* ---- Leaderboard ---- */
  .lb-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(27,42,61,0.08);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{width:22px; font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:13px; color:var(--slate); text-align:center; flex-shrink:0;}
  .lb-rank.gold{color:#B4894F;} .lb-rank.silver{color:#8C97A0;} .lb-rank.bronze{color:#A8703F;}
  .lb-you{background:var(--parchment-2); border-radius:10px; margin:0 -8px; padding:11px 8px;}
  .lb-stat{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:13px; color:var(--ink);}

  /* ---- Score chips & tier picker ---- */
  .score-chip{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:13px; color:#fff;
    background:var(--c); border-radius:8px; min-width:36px; height:34px; padding:0 6px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .score-chip-sm{font-size:10.5px; min-width:28px; height:24px; border-radius:6px;}
  .tier-pills{display:flex; gap:8px; margin:4px 0 16px;}
  .tier-pill{
    flex:1; padding:11px 4px; border-radius:10px; border:1.5px solid var(--slate);
    background:#fff; text-align:center; font-size:11.5px; font-weight:600; color:var(--slate);
    cursor:pointer; line-height:1.3;
  }
  .tier-pill.selected{border-color:var(--c); background:var(--c); color:#fff;}

  /* ---- Recommended / average score row ---- */
  .mini-score-row{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
  .mini-score{display:flex; align-items:center; gap:4px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--slate);}
  .mini-score svg{width:11px; height:11px; flex-shrink:0;}
  .mini-score .val{font-weight:700; color:var(--ink);}
  .mini-score.locked{opacity:0.55; font-style:italic;}

  /* ---- Breakdown (Activities / Cities / Countries) ---- */
  .breakdown-header{
    display:flex; justify-content:space-between; align-items:center;
    margin:14px 0 4px; font-size:12.5px; color:var(--slate);
  }
  .breakdown-header .pill{padding:5px 11px; font-size:9.5px;}
  .breakdown-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 0; border-bottom:1px solid rgba(27,42,61,0.08); cursor:pointer;
  }
  .breakdown-row:last-child{border-bottom:none;}
  .avg-circle{
    width:42px; height:42px; border-radius:50%;
    border:2px solid var(--c); background:#fff; color:var(--c);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:13px;
  }
  .screen{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 90px;
    display:none;
  }
  .screen.active{display:block;}
  .screen::-webkit-scrollbar{width:0px;}

  /* ---- Section headers ---- */
  .sec-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--slate);
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sec-label:first-child{margin-top:0;}
  .sec-label::after{
    content:'';
    flex:1;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--slate) 0 3px, transparent 3px 6px);
    opacity:0.4;
  }

  /* ---- Stamp badges (category selector) ---- */
  .stamps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .stamp{
    aspect-ratio:1;
    border-radius:50%;
    border:2.5px solid var(--c);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
    background:radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
    transform:rotate(-5deg);
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
    color:var(--c);
  }
  .stamp:nth-child(2){transform:rotate(4deg);}
  .stamp:nth-child(3){transform:rotate(-3deg);}
  .stamp:nth-child(4){transform:rotate(5deg);}
  .stamp:nth-child(5){transform:rotate(-4deg);}
  .stamp::before{
    content:'';
    position:absolute; inset:5px;
    border:1px dashed var(--c);
    border-radius:50%;
    opacity:0.6;
  }
  .stamp:hover{transform:rotate(0deg) scale(1.04);}
  .stamp.selected{
    background:var(--c);
    color:var(--parchment);
    box-shadow:0 6px 16px -4px rgba(0,0,0,0.35);
  }
  .stamp.selected::before{border-color:var(--parchment); opacity:0.5;}
  .stamp svg{width:22px; height:22px;}
  .stamp-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:8px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    text-align:center;
    line-height:1.1;
  }

  /* ---- Experience cards ---- */
  .xcard{
    background:#fff;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 4px 14px -6px rgba(27,42,61,0.25);
    margin-bottom:12px;
    display:flex;
    border:1px solid rgba(27,42,61,0.06);
    cursor:pointer;
  }
  .xcard-media{
    width:84px;
    flex-shrink:0;
    background:var(--c);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .xcard-media svg{width:30px; height:30px; color:rgba(255,255,255,0.92); position:relative;}
  .xcard-media::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(160deg, rgba(255,255,255,0.18), transparent 60%);
  }
  .xcard-body{
    padding:12px 14px;
    flex:1;
    min-width:0;
  }
  .xcard-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .xcard-name{font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--ink); line-height:1.25;}
  .xcard-loc{font-size:11.5px; color:var(--slate); margin-top:2px;}
  .xcard-blurb{font-size:12px; color:var(--slate); margin-top:6px; line-height:1.4;}
  .src-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:8.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:2px 6px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .src-viator{background:#e9f0f4; color:#2b5876;}
  .src-gyg{background:#eef3e6; color:#4a6b2c;}
  .src-user{background:#f6ece1; color:var(--brass-dark);}

  /* ---- Buttons ---- */
  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13.5px;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--ink); color:var(--cream);}
  .btn-brass{background:var(--brass); color:var(--ink);}
  .btn-outline{background:transparent; border:1.5px solid var(--slate); color:var(--slate);}
  .btn-approve{background:var(--trail); color:#fff;}
  .btn-reject{background:transparent; border:1.5px solid var(--signal); color:var(--signal);}
  .btn-block{width:100%; display:block; text-align:center;}
  .btn-sm{padding:8px 12px; font-size:12px; border-radius:8px;}

  /* ---- Rank list ---- */
  .rank-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid rgba(27,42,61,0.08);
    cursor:pointer;
  }
  .rank-row:last-child{border-bottom:none;}
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    background:var(--parchment-2);
    border:1px solid rgba(27,42,61,0.15);
    border-radius:6px;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    position:relative;
  }
  .tag::before{
    content:'';
    position:absolute; left:-6px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%;
    background:var(--parchment); border:1px solid rgba(27,42,61,0.15);
  }
  .rank-info{flex:1; min-width:0;}
  .rank-name{font-family:'Fraunces', serif; font-size:14px; font-weight:600; color:var(--ink);}
  .rank-loc{font-size:11px; color:var(--slate); margin-top:1px;}

  /* ---- Duel screen ---- */
  .vs-wrap{display:flex; flex-direction:column; gap:14px; align-items:center;}
  .duel-card{
    width:100%;
    background:#fff;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 8px 22px -8px rgba(27,42,61,0.3);
    border:1px solid rgba(27,42,61,0.06);
  }
  .duel-media{
    height:110px;
    background:var(--c);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .duel-media svg{width:38px; height:38px; color:rgba(255,255,255,0.92);}
  .duel-body{padding:14px 16px;}
  .duel-name{font-family:'Fraunces', serif; font-weight:600; font-size:17px; color:var(--ink);}
  .duel-loc{font-size:12px; color:var(--slate); margin:2px 0 8px;}
  .duel-blurb{font-size:12.5px; color:var(--slate); line-height:1.45; margin-bottom:12px;}
  .vs-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:2px;
    color:var(--brass-dark);
    background:var(--parchment-2);
    border:1px dashed var(--brass);
    border-radius:20px;
    padding:4px 12px;
  }
  .duel-actions{display:flex; gap:10px; margin-top:6px;}

  /* ---- Queue cards ---- */
  .qcard{
    background:#fff;
    border-radius:var(--radius);
    padding:14px;
    box-shadow:0 4px 14px -6px rgba(27,42,61,0.2);
    margin-bottom:12px;
    border:1px solid rgba(27,42,61,0.06);
  }
  .qcard-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .qcard-name{font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--ink);}
  .qcard-loc{font-size:11.5px; color:var(--slate); margin-top:2px;}
  .qcard-meta{font-size:11px; color:var(--slate); margin:8px 0 10px;}
  .qcard-meta b{color:var(--ink);}
  .qcard-actions{display:flex; gap:8px;}
  .cat-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; text-transform:uppercase; letter-spacing:0.5px;
    padding:3px 8px; border-radius:20px;
    color:#fff;
  }

  /* ---- Bottom nav ---- */
  .nav{
    position:absolute; bottom:0; left:0; right:0;
    background:var(--ink);
    display:flex;
    padding:9px 2px 13px;
  }
  .nav-item{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer;
    color:rgba(241,233,216,0.5);
    font-family:'IBM Plex Mono', monospace;
    font-size:8px; letter-spacing:0.3px; text-transform:uppercase;
    padding:4px 0;
    position:relative;
  }
  .nav-item svg{width:17px; height:17px;}
  .nav-item.active{color:var(--brass);}
  .nav-badge{
    position:absolute; top:-2px; right:22%;
    background:var(--signal); color:#fff;
    font-size:8px; font-weight:700;
    width:14px; height:14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter', sans-serif;
  }

  /* ---- FAB ---- */
  .fab{
    position:absolute; right:16px; bottom:88px;
    width:50px; height:50px; border-radius:50%;
    background:var(--brass); color:var(--ink);
    border:none; box-shadow:0 8px 18px -4px rgba(180,137,79,0.6);
    display:none; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .fab svg{width:22px; height:22px;}

  /* ---- Modal ---- */
  .modal-overlay{
    position:absolute; inset:0;
    background:rgba(19,30,43,0.55);
    display:none;
    align-items:flex-end;
    z-index:20;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--parchment);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:20px;
    max-height:80%;
    overflow-y:auto;
  }
  .modal h3{font-family:'Fraunces', serif; font-size:18px; color:var(--ink); margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:1px; text-transform:uppercase;
    color:var(--slate); display:block; margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    border:1.5px solid rgba(27,42,61,0.2);
    background:#fff;
    border-radius:8px;
    padding:9px 11px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--ink);
  }
  .field textarea{resize:none; height:60px;}

  /* ---- Toast ---- */
  .toast{
    position:absolute; top:70px; left:50%; transform:translateX(-50%) translateY(-10px);
    background:var(--ink); color:var(--cream);
    padding:10px 16px; border-radius:20px;
    font-size:12px; font-weight:500;
    box-shadow:0 8px 20px -6px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none;
    transition:all .25s ease;
    z-index:30;
    display:flex; align-items:center; gap:8px;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast svg{width:14px; height:14px; color:var(--trail); flex-shrink:0;}

  .empty{
    text-align:center; padding:40px 20px; color:var(--slate);
  }
  .empty svg{width:34px; height:34px; margin-bottom:10px; opacity:0.5;}
  .empty p{font-size:12.5px; line-height:1.5;}

  .caption{
    font-size:11px; color:var(--slate); text-align:center; margin-top:10px; opacity:0.7;
  }
</style>
</head>

const TIERS_META = {
  liked:    {label:'I liked it', range:[6.7, 10.0], color:'var(--trail)'},
  fine:     {label:'It was fine', range:[4.0, 6.7], color:'var(--brass)'},

};
function round1(n){ return Math.round(n * 10) / 10; }
function computeScore(tier, position, total){
  const [tmin, tmax] = TIERS_META[tier].range;
  if(total === 0) return round1(tmax - 0.2);
  const frac = position / total;
  return round1(tmax - frac * (tmax - tmin));
}
function insertByScore(category, item){
  const list = ranked[category];

  return idx;
}

/* ---- Real-world map: equirectangular projection from actual coordinates ---- */
const MAP_W = 720, MAP_H = 360;
function project(lon, lat){
  return [ (lon + 180) * (MAP_W/360), (90 - lat) * (MAP_H/180) ];
}
function smoothClosedPath(points){
  if(points.length < 3) return '';
  const n = points.length;
  let d = `M ${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
  for(let i=0;i<n;i++){
    const p0 = points[(i-1+n)%n], p1 = points[i], p2 = points[(i+1)%n], p3 = points[(i+2)%n];
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + ' Z';
}

    return `<path d="${smoothClosedPath(projected)}"/>`;

  r2: {lon:-73.03, lat:-50.95},  // Patagonia, Chile
  r3: {lon:25.86, lat:-17.92},   // Victoria Falls, Zambia
  r4: {lon:14.48, lat:40.63},    // Positano, Italy
  r5: {lon:-5.00, lat:34.06}     // Fes, Morocco
};
function haversineKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLon = (b.lon - a.lon) * Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function computeBeenPins(){
  return Object.keys(COORDS).filter(id => findRankedItemById(id)).map(id => ({id, ...COORDS[id]}));
}
function findRankedItemById(id){
  for(const cat of Object.keys(ranked)){
    if(ranked[cat].find(i => i.id === id)) return true;
  }
  return false;
}
function findRankedItem(id){
  for(const cat of Object.keys(ranked)){
    const hit = ranked[cat].find(i => i.id === id);
    if(hit) return {...hit, category:cat};
  }
  return null;
}
let profileSubTab = 'been';
let breakdownSubTab = 'activities';
let breakdownSort = 'count';

function tierForScore(score){
  for(const key of Object.keys(TIERS_META)){
    const [min, max] = TIERS_META[key].range;
    if(score >= min && score <= max) return key;
  }
  return 'fine';
}
function avgCircle(score){
  const tier = tierForScore(score);
  return `<div class="avg-circle" style="--c:${TIERS_META[tier].color}">${score.toFixed(1)}</div>`;
}
function computeBreakdown(type){
  let allItems = [];
  Object.keys(ranked).forEach(cat => ranked[cat].forEach(i => allItems.push({...i, category:cat})));

  const groups = {};
  allItems.forEach(i => {
    let key;
    if(type === 'activities') key = LABELS[i.category];
    else if(type === 'cities') key = i.loc.split(',')[0].trim();
    else key = i.loc.split(',').pop().trim();
    if(!groups[key]) groups[key] = { label:key, items:[], category: type==='activities' ? i.category : null };
    groups[key].items.push(i);
  });

  let arr = Object.values(groups).map(g => {
    const sortedItems = [...g.items].sort((a,b) => b.score - a.score);
    return {
      label: g.label,
      count: sortedItems.length,
      avg: round1(sortedItems.reduce((s,i) => s + i.score, 0) / sortedItems.length),
      items: sortedItems,
      category: g.category
    };
  });
  arr.sort((a,b) => breakdownSort === 'count' ? (b.count - a.count) : (b.avg - a.avg));
  return arr;
}

function nearYouOptions(){
  const seen = new Set();

  allCatalogItems().forEach(i => {

      opts.push({id:i.id, label:i.loc});

  return opts;
}
function isUSLocation(loc){
  return /united states|\busa\b/i.test(loc);
}
function formatDistance(km, isUS){
  if(isUS){
    const mi = km * 0.621371;
    return `${mi < 1 ? '<1' : Math.round(mi)} mi`;
  }
  return `${km < 1 ? '<1' : Math.round(km)} km`;
}
function renderNearYou(){
  const select = document.getElementById('near-you-select');
  const opts = nearYouOptions();
  select.innerHTML = opts.map(o => `<option value="${o.id}" ${o.id===nearYouSelectedId?'selected':''}>${o.label}</option>`).join('');

  const originOpt = opts.find(o => o.id === nearYouSelectedId);

  const items = allCatalogItems().filter(i => i.id !== nearYouSelectedId && COORDS[i.id]);
  const withDist = items.map(i => ({...i, dist: haversineKm(origin, COORDS[i.id])})).sort((a,b) => a.dist - b.dist).slice(0,5);

    wireLogStep();

  if(duelState.lo >= duelState.hi){
    // finished this tier's comparisons — compute score, attach details, insert by score

    duelState.item.tier = duelState.tier;

    duelState.item.visits = 1;
    duelState.item.lastVisited = 'today';

    el.innerHTML = `<div class="empty">

      <p>#${globalIdx + 1} in your ${LABELS[duelState.category]} list.</p>
    </div>
    <button class="btn btn-brass btn-block" id="continue-rank">Continue</button>`;
    document.getElementById('continue-rank').addEventListener('click', () => {
      duelState = null;
      renderAll();
    });
    return;
  }

  const oppIdx = currentOpponentIndex();
  const opponent = duelState.tierList[oppIdx];
  const item = duelState.item;

  el.innerHTML = `
    <div class="caption" style="margin-bottom:14px;">Comparing against your "${TIERS_META[duelState.tier].label}" ${LABELS[duelState.category]} · round ${duelState.comparisons + 1}</div>
    <div class="vs-wrap">
      <div class="duel-card">
        <div class="duel-media" style="${mediaStyle(duelState.category, duelState.photo)}">${duelState.photo ? '' : itemArt(item, duelState.category)}</div>
        <div class="duel-body">
          <div class="duel-name">${item.name}</div>
          <div class="duel-loc">${item.loc}</div>
          <div class="duel-blurb">${item.blurb}</div>
          <button class="btn btn-primary btn-block" data-pick="item">This was better</button>
        </div>
      </div>
      <div class="vs-badge">VS</div>
      <div class="duel-card">
        <div class="duel-media" style="${mediaStyle(duelState.category, opponent.photo)}">${opponent.photo ? '' : itemArt(opponent, duelState.category)}</div>
        <div class="duel-body">
          <div class="duel-top" style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div class="duel-name">${opponent.name}</div>
            ${scoreChip(opponent.score, opponent.tier, true)}
          </div>
          <div class="duel-loc">${opponent.loc}</div>
          <div class="duel-blurb">${opponent.blurb}</div>
          <button class="btn btn-primary btn-block" data-pick="opponent">This was better</button>
        </div>
      </div>
      <div class="duel-actions">
        <button class="btn btn-outline" style="flex:1;" id="duel-tie">Too tough to call</button>
        <button class="btn btn-outline" style="flex:1;" id="duel-skip">Skip for now</button>
      </div>
    </div>`;

  el.querySelector('[data-pick="item"]').addEventListener('click', () => {
    duelState.hi = oppIdx;
    duelState.comparisons++;
    renderRank();
  });
  el.querySelector('[data-pick="opponent"]').addEventListener('click', () => {
    duelState.lo = oppIdx + 1;
    duelState.comparisons++;
    renderRank();
  });
  document.getElementById('duel-tie').addEventListener('click', () => {
    duelState.lo = oppIdx + 1;
    duelState.comparisons++;
    renderRank();
  });
  document.getElementById('duel-skip').addEventListener('click', () => {
    duelState = null;
    renderRank();
  });
}

/* ---------------- PROFILE TAB ---------------- */
function renderWorldMap(){
  const pins = computeBeenPins().map(p => {
    const item = findRankedItem(p.id);
    if(!item) return '';
    const [x, y] = project(p.lon, p.lat);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${COLORS[item.category]}" stroke="var(--ink)" stroke-width="0.9"><title>${item.name} — ${item.loc}</title></circle>`;
  }).join('');

  return `<div class="map-card"><svg viewBox="0 0 ${MAP_W} ${MAP_H}" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="var(--parchment)" rx="6"/>
    <g fill="var(--parchment-2)" stroke="var(--slate)" stroke-width="1" opacity="0.9">
      ${continentPaths()}
    </g>
    ${pins}
  </svg></div>`;
}

function renderProfileHeader(){
  const tier = currentTier();
  const totalLogged = Object.values(ranked).reduce((n, arr) => n + arr.length, 0);
  const unlockedBadges = computeAchievements().filter(b => b.unlocked).length;
  document.getElementById('profile-header').innerHTML = `
    <div class="profile-head">
      <div class="avatar" id="user-avatar" style="${userPhoto ? `background-image:url(${userPhoto}); background-size:cover; background-position:center;` : ''}">
        ${userPhoto ? '' : 'Y'}
        <div style="position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:50%; background:var(--brass); border:2px solid var(--parchment); display:flex; align-items:center; justify-content:center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/></svg>
        </div>
      </div>
      <input type="file" accept="image/*" id="user-avatar-input" style="display:none;">
      <div style="flex:1;">
        <div class="profile-name">You</div>
        <div class="profile-rank">#342 of 12,480 travelers · Top 8% in Nature</div>
        <span class="profile-tier-chip">${tier.name} · ${totalLogged} logged</span>
      </div>
    </div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn btn-outline btn-sm" style="flex:1;" id="open-badges-btn">Badges (${unlockedBadges})</button>
      <button class="btn btn-outline btn-sm" style="flex:1;" id="open-recap-btn">Year in Travel</button>
    </div>`;
  document.getElementById('open-badges-btn').addEventListener('click', openBadges);
  document.getElementById('open-recap-btn').addEventListener('click', openRecap);
  document.getElementById('user-avatar').addEventListener('click', () => document.getElementById('user-avatar-input').click());
  document.getElementById('user-avatar-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      userPhoto = ev.target.result;
      renderProfileHeader();
    };
    reader.readAsDataURL(file);
  });
}

function renderMapCaption(){
  const pins = computeBeenPins();
  const countries = new Set(pins.map(p => {
    const item = findRankedItem(p.id);
    return item ? item.loc.split(',').pop().trim() : null;
  }).filter(Boolean));
  const legend = Object.keys(LABELS).map(cat => `<span class="legend-dot" style="--c:${COLORS[cat]}">${LABELS[cat]}</span>`).join('');
  return `<div class="map-caption"><span>${pins.length} places · ${countries.size} countries</span></div>
  <div class="map-legend" style="margin-top:6px;">${legend}</div>`;
}

function renderProfilePills(){
  const pills = [
    {id:'been', label:'Been'},
    {id:'want', label:'Want to try'},
    {id:'recs', label:'Recs for you'},
    {id:'breakdown', label:'Breakdown'},
    {id:'leaderboard', label:'Leaderboard'},
    {id:'standing', label:'Standing'}
  ];
  document.getElementById('profile-pills').innerHTML = pills.map(p =>
    `<button class="pill ${profileSubTab===p.id?'active':''}" data-pill="${p.id}">${p.label}</button>`
  ).join('');
  document.querySelectorAll('[data-pill]').forEach(b => b.addEventListener('click', () => {
    profileSubTab = b.dataset.pill;
    renderProfileTab();
  }));
}

function renderProfileTab(){
  renderProfileHeader();
  document.getElementById('taste-map').innerHTML = renderWorldMap() + renderMapCaption();
  renderProfilePills();

  const content = document.getElementById('profile-content');

  if(profileSubTab === 'standing'){
    content.innerHTML = renderStandingSection();
    wireStandingSection();
    return;
  }

  if(profileSubTab === 'breakdown'){
    content.innerHTML = renderBreakdownSection();
    wireBreakdownSection();
    return;
  }

  if(profileSubTab === 'leaderboard'){
    content.innerHTML = renderLeaderboard();
    return;
  }

  content.innerHTML = `<div class="stamps" id="profile-cat-stamps" style="margin:12px 0 14px;"></div><div id="profile-list-inner"></div>`;
  renderStamps('profile-cat-stamps');

  const target = document.getElementById('profile-list-inner');
  if(profileSubTab === 'been'){
    const items = ranked[currentCategory] || [];
    target.innerHTML = items.length ? items.map((i, idx) => rankRowHTML(i, idx)).join('') : `<div class="empty"><p>Nothing ranked in ${LABELS[currentCategory]} yet.</p></div>`;
    wireDetailClicks(target, items);
  } else if(profileSubTab === 'want'){
    const items = wantToTry[currentCategory] || [];
    target.innerHTML = renderCategoryFilteredListInner(wantToTry, `Nothing bookmarked in ${LABELS[currentCategory]} yet.`);
    wireDetailClicks(target, items);
  } else if(profileSubTab === 'recs'){
    const items = recs[currentCategory] || [];
    target.innerHTML = renderCategoryFilteredListInner(recs, `No recommendations in ${LABELS[currentCategory]} yet.`, i => `<div class="rec-why">${i.why}</div>`);
    wireDetailClicks(target, items);
  }
}

function renderBreakdownSection(){
  const subTabs = [
    {id:'activities', label:'Activities'},
    {id:'cities', label:'Cities'},
    {id:'countries', label:'Countries'}
  ];
  const groups = computeBreakdown(breakdownSubTab);
  const noun = subTabs.find(t => t.id === breakdownSubTab).label;

  return `
    <div class="pill-nav" id="breakdown-subtabs" style="margin-top:0;">
      ${subTabs.map(t => `<button class="pill ${breakdownSubTab===t.id?'active':''}" data-subtab="${t.id}">${t.label}</button>`).join('')}
    </div>
    <div class="breakdown-header">
      <span>${groups.length} ${noun}</span>
      <button class="pill" id="breakdown-sort">Sort: ${breakdownSort === 'count' ? 'Count' : 'Score'}</button>
    </div>
    ${groups.length ? groups.map(g => `
      <div class="breakdown-row" data-group="${g.label}">
        <div>
          <div class="rank-name">${g.label}</div>
          <div class="rank-loc">${g.count} place${g.count>1?'s':''}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          ${avgCircle(g.avg)}
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2" style="width:16px;height:16px;"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </div>`).join('') : `<div class="empty"><p>Nothing ranked yet.</p></div>`}
  `;
}

function wireBreakdownSection(){
  document.querySelectorAll('#breakdown-subtabs .pill').forEach(b => b.addEventListener('click', () => {
    breakdownSubTab = b.dataset.subtab;
    renderProfileTab();
  }));
  document.getElementById('breakdown-sort').addEventListener('click', () => {
    breakdownSort = breakdownSort === 'count' ? 'score' : 'count';
    renderProfileTab();
  });
  const groups = computeBreakdown(breakdownSubTab);
  document.querySelectorAll('[data-group]').forEach(el => {
    const group = groups.find(g => g.label === el.dataset.group);
    if(group) el.addEventListener('click', () => openGroupDetail(group));
  });
}

function openGroupDetail(group){
  document.getElementById('group-modal').innerHTML = `
    <h3 style="font-family:'Fraunces',serif; font-size:18px; color:var(--ink); margin-bottom:2px;">${group.label}</h3>
    <p class="caption" style="text-align:left; margin-bottom:14px;">${group.count} place${group.count>1?'s':''} · avg ${group.avg.toFixed(1)}</p>
    <div id="group-list-inner">${group.items.map((i, idx) => rankRowHTML(i, idx)).join('')}</div>
    <button class="btn btn-brass btn-block" id="group-close" style="margin-top:16px;">Close</button>
  `;
  document.getElementById('group-overlay').classList.add('active');
  document.getElementById('group-close').addEventListener('click', () => document.getElementById('group-overlay').classList.remove('active'));
  wireDetailClicks(document.getElementById('group-list-inner'), group.items);
}
document.getElementById('group-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'group-overlay') document.getElementById('group-overlay').classList.remove('active');
});

function renderCategoryFilteredListInner(dataset, emptyText, extraLineFn){
  const items = dataset[currentCategory] || [];
  return items.length ? items.map(i => `
    <div class="xcard" data-open-id="${i.id}">
      <div class="xcard-media" style="${mediaStyle(currentCategory, i.photo)}">${i.photo ? '' : itemArt(i, currentCategory)}</div>
      <div class="xcard-body">
        <div class="xcard-top">
          <div>
            <div class="xcard-name">${i.name}</div>
            <div class="xcard-loc">${i.loc}</div>
          </div>
        </div>
        ${extraLineFn ? extraLineFn(i) : `<div class="xcard-blurb">${i.blurb}</div>`}
        ${miniScoreRow(i)}
      </div>
    </div>`).join('') : `<div class="empty"><p>${emptyText}</p></div>`;
}

function renderStandingSection(){
  const tier = currentTier();
  const score = standingScore();
  const perks = perksUnlocked();
  const joinedCount = invites.filter(i => i.status === 'joined').length;
  return `
    <div class="tier-stamp">
      <div class="tier-name">${tier.name}</div>
      <div class="tier-sub">Standing ${score}</div>
    </div>

    <div class="sec-label" style="margin-top:4px;">Invites</div>
    <div class="stat-row">
      <div class="stat-label">Sent</div>
      <div class="stat-value">${invites.length} / ${user.invitesTotal}</div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${(invites.length/user.invitesTotal)*100}%; background:var(--brass);"></div></div>
    <button class="btn btn-brass btn-block" id="send-invite" style="margin-top:12px;">Send an invite</button>

    ${invites.length ? invites.map(inv => `
      <div class="stat-row">
        <div class="stat-label">${inv.handle}</div>
        ${inv.status === 'joined'
          ? `<span class="perk-status unlocked">Joined</span>`
          : `<button class="btn btn-outline btn-sm" data-join="${inv.id}">Mark as joined (demo)</button>`}
      </div>`).join('') : ''}
    <p class="caption" style="margin-top:6px; text-align:left;">Average score unlocks once an invite you sent actually joins — not just for sending one. Use "Mark as joined" to simulate that, since there's no real signup here yet.</p>

    <div class="sec-label">Reliability</div>
    <div class="stat-row">
      <div class="stat-label">Score</div>
      <div class="stat-value">${user.reliability}%</div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${user.reliability}%;"></div></div>
    <p class="caption" style="margin-top:6px; text-align:left;">Goes up when you release a spot you can't use ahead of time. Goes down on no-shows.</p>

    <div class="sec-label">Perks</div>
    <div class="perk-row">
      <div class="perk-icon ${perks.avgScore ? 'unlocked':'locked'}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
      </div>
      <div class="perk-text">
        <div class="perk-name">Average friend score</div>
        <div class="perk-desc">See how your circle rated a place before you go</div>
      </div>
      <div class="perk-status ${perks.avgScore ? 'unlocked':'locked'}">${perks.avgScore ? 'Unlocked' : 'Invite someone who joins'}</div>
    </div>
    <div class="perk-row">
      <div class="perk-icon ${perks.resPriority ? 'unlocked':'locked'}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div class="perk-text">
        <div class="perk-name">Reservation priority</div>
        <div class="perk-desc">First in line when a booked spot opens up</div>
      </div>
      <div class="perk-status ${perks.resPriority ? 'unlocked':'locked'}">${perks.resPriority ? 'Unlocked' : '3 invites sent + 75% reliability'}</div>
    </div>

    <div class="sec-label">Upcoming</div>
    ${upcoming.length ? upcoming.map(u => `
      <div class="upcoming-card">
        <div class="upcoming-top">
          <div>
            <div class="upcoming-name">${u.name}</div>
            <div class="upcoming-loc">${u.loc}</div>
          </div>
          <div class="upcoming-date">${u.date}</div>
        </div>
        <button class="btn btn-outline btn-sm btn-block" style="margin-top:10px;" data-release="${u.id}">Can't make it — release my spot</button>
      </div>`).join('') : `<p class="caption" style="text-align:left;">Nothing booked right now.</p>`}
  `;
}

function wireStandingSection(){
  document.getElementById('send-invite').addEventListener('click', () => {
    if(invites.length >= user.invitesTotal){ toast('No invites left this cycle', false); return; }
    const usedHandles = invites.map(i => i.handle);
    const next = INVITE_POOL.find(h => !usedHandles.includes(h));
    if(!next){ toast('No one left in your contacts to invite', false); return; }
    invites.push({id:'inv' + Date.now(), handle: next, status:'sent'});
    renderProfileTab();
    toast(`Invite sent to ${next}`);
  });
  document.querySelectorAll('[data-join]').forEach(b => b.addEventListener('click', () => {
    const inv = invites.find(i => i.id === b.dataset.join);
    if(!inv) return;
    const wasAnyJoinedBefore = invites.some(i => i.status === 'joined');
    inv.status = 'joined';
    renderProfileTab();
    toast(wasAnyJoinedBefore ? `${inv.handle} joined` : `${inv.handle} joined — average scores unlocked!`);
  }));
  document.querySelectorAll('[data-release]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.release;
    upcoming = upcoming.filter(u => u.id !== id);
    user.reliability = Math.min(100, user.reliability + 4);
    renderProfileTab();
    toast('Spot released — reliability +4');
  }));
}

document.getElementById('profile-btn').addEventListener('click', () => {
  document.querySelector('.nav-item[data-tab="profile"]').click();
});
document.getElementById('notif-btn').addEventListener('click', openNotifications);
document.getElementById('msg-btn').addEventListener('click', () => {
  renderConvoList();
  document.getElementById('msg-overlay').classList.add('active');
});

function renderAll(){
  renderFeed();
  renderDiscover();
  renderList();
  renderQueue();
  renderRank();
  renderProfileTab();
  renderNotifBadge();
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {

    btn.classList.add('active');

});

/* ---------------- MODAL ---------------- */
const overlay = document.getElementById('modal-overlay');
let submitPhoto = null;
function wireSubmitPhotoBox(){
  const trigger = document.getElementById('submit-photo-trigger');
  if(trigger) trigger.addEventListener('click', () => document.getElementById('submit-photo-input').click());
  const removeBtn = document.getElementById('submit-photo-remove');
  if(removeBtn) removeBtn.addEventListener('click', () => { submitPhoto = null; renderSubmitPhotoArea(); });
}
function renderSubmitPhotoArea(){
  const area = document.getElementById('submit-photo-area');
  area.innerHTML = submitPhoto
    ? `<div class="photo-preview-wrap"><img class="photo-preview" src="${submitPhoto}"><button class="photo-remove" id="submit-photo-remove">✕</button></div>`
    : `<div class="photo-box" id="submit-photo-trigger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/><path d="M8 5l1.5-2h5L16 5"/></svg>
        Tap to add a photo
      </div>`;
  wireSubmitPhotoBox();
}
document.getElementById('submit-photo-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { submitPhoto = ev.target.result; renderSubmitPhotoArea(); };
  reader.readAsDataURL(file);
});
wireSubmitPhotoBox();

function openSubmitModal(prefillName){
  document.getElementById('f-name').value = prefillName || '';
  overlay.classList.add('active');
}
document.getElementById('fab-add').addEventListener('click', () => openSubmitModal());
document.getElementById('modal-cancel').addEventListener('click', () => {
  overlay.classList.remove('active');
  submitPhoto = null;
  renderSubmitPhotoArea();
});
document.getElementById('modal-submit').addEventListener('click', () => {
  const name = document.getElementById('f-name').value.trim();
  const loc = document.getElementById('f-location').value.trim();
  const category = document.getElementById('f-category').value;
  const desc = document.getElementById('f-desc').value.trim();
  const licensed = document.getElementById('f-license').checked;
  if(!name || !loc){ toast('Add a name and location', false); return; }
  pending.push({
    id:'p' + Date.now(),
    name, loc, category,
    blurb: desc || 'No description provided.',
    submitter:'@you',
    photo: submitPhoto,
    licensed: !!(submitPhoto && licensed)
  });
  document.getElementById('f-name').value = '';
  document.getElementById('f-location').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-license').checked = false;
  submitPhoto = null;
  renderSubmitPhotoArea();
  overlay.classList.remove('active');
  renderAll();
  toast('Submitted — awaiting approval');
});

document.getElementById('search-input').addEventListener('input', (e) => {
  renderSearchResults(e.target.value);
});
document.getElementById('near-you-select').addEventListener('change', (e) => {
  nearYouSelectedId = e.target.value;
  renderNearYou();
});

renderAll();
</script>
